<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Satellite Chess</title>
    <!--
      `viewport-fit=cover` so the board can reach into the notch area; the app
      chrome stays inside `safe-area-inset` instead. `user-scalable=no` because
      a pinch-zoom while jogging to a square is never what anyone meant.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Satellite Chess</title>
    <!--
      `viewport-fit=cover` so the board can reach into the notch area; the app
      chrome stays inside `safe-area-inset` instead. `user-scalable=no` because
      a pinch-zoom while jogging to a square is never what anyone meant.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <!--
      Every asset path here is absolute, and must stay that way. This one file is
      served at `/`, at `/j/CODE` for a scanned invite and at `/f/<blob>` for a
      shared field; a relative `app.js` would resolve against the *document*, ask
      for `/j/app.js`, and the app would not load at all. See O-06.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest icon for the home screen and takes this one. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Named explicitly so the browser stops guessing at `/favicon.ico`, which
         is a 404 on every single page load. -->
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sat Chess" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Satellite Chess</title>
    <!--
      `viewport-fit=cover` so the board can reach into the notch area; the app
      chrome stays inside `safe-area-inset` instead. `user-scalable=no` because
      a pinch-zoom while jogging to a square is never what anyone meant.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS ignores the manifest icon for the home screen and takes this one. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sat Chess" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
